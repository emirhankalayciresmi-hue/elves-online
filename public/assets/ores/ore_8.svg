<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Radial Back Glow -->
    <radialGradient id="g8_ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#fb923c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Main Gradient -->
    <linearGradient id="g8_main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Sub Gradient -->
    <linearGradient id="g8_sub" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="f8_glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="64" cy="64" r="54" fill="url(#g8_ambient)"/>

  <!-- Main Gemstone Shapes -->
  <g>
    
      <!-- Radiant Diamond-Cut Sun Gem -->
      <polygon points="64,14 104,48 88,108 40,108 24,48" fill="url(#g8_main)" stroke="#fde047" stroke-width="2.5" filter="url(#f8_glow)"/>
      <polygon points="64,32 88,54 78,94 50,94 40,54" fill="#f97316" stroke="#fde047" stroke-width="1.5"/>
      <polygon points="64,14 104,48 88,54 64,32" fill="#fde047" opacity="0.5"/>
      <polygon points="64,14 24,48 40,54 64,32" fill="#ea580c" opacity="0.7"/>
      <!-- Central Sun Core -->
      <circle cx="64" cy="68" r="10" fill="#ffffff" filter="url(#f8_glow)"/>
      <!-- Sun Rays -->
      <line x1="64" y1="8" x2="64" y2="2" stroke="#fde047" stroke-width="2.5"/>
      <line x1="110" y1="44" x2="118" y2="42" stroke="#fde047" stroke-width="2.5"/>
      <line x1="18" y1="44" x2="10" y2="42" stroke="#fde047" stroke-width="2.5"/>
      <line x1="94" y1="114" x2="100" y2="120" stroke="#fde047" stroke-width="2.5"/>
      <line x1="34" y1="114" x2="28" y2="120" stroke="#fde047" stroke-width="2.5"/>
    
  </g>
</svg>