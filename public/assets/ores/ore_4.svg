<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Radial Back Glow -->
    <radialGradient id="g4_ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#fbbf24" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Main Gradient -->
    <linearGradient id="g4_main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Sub Gradient -->
    <linearGradient id="g4_sub" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="f4_glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="64" cy="64" r="54" fill="url(#g4_ambient)"/>

  <!-- Main Gemstone Shapes -->
  <g>
    
      <!-- Heavy Elven Steel Ingot -->
      <polygon points="28,40 100,40 114,84 14,84" fill="url(#g4_main)" stroke="#f59e0b" stroke-width="2.5" filter="url(#f4_glow)"/>
      <polygon points="28,40 100,40 88,54 40,54" fill="#f59e0b" opacity="0.4"/>
      <polygon points="14,84 40,54 88,54 114,84" fill="#64748b" opacity="0.5"/>
      <!-- Golden Leaf Seal -->
      <circle cx="64" cy="66" r="14" fill="#000000" opacity="0.4"/>
      <circle cx="64" cy="66" r="12" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <path d="M64,56 C70,62 70,72 64,76 C58,72 58,62 64,56 Z" fill="#f59e0b"/>
      <line x1="64" y1="56" x2="64" y2="76" stroke="#000000" stroke-width="1"/>
      <line x1="28" y1="40" x2="14" y2="84" stroke="#f59e0b" stroke-width="1"/>
      <line x1="100" y1="40" x2="114" y2="84" stroke="#f59e0b" stroke-width="1"/>
    
  </g>
</svg>