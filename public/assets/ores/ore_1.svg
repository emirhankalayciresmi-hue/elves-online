<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Radial Back Glow -->
    <radialGradient id="g1_ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Main Gradient -->
    <linearGradient id="g1_main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Sub Gradient -->
    <linearGradient id="g1_sub" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="f1_glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="64" cy="64" r="54" fill="url(#g1_ambient)"/>

  <!-- Main Gemstone Shapes -->
  <g>
    
      <!-- Raw Silver Nuggets with Moon Glyph -->
      <polygon points="64,24 88,44 78,88 44,92 34,54" fill="url(#g1_main)" stroke="#f8fafc" stroke-width="2"/>
      <polygon points="64,24 78,88 56,60" fill="#94a3b8" opacity="0.6"/>
      <polygon points="88,44 104,74 78,88" fill="url(#g1_sub)" stroke="#f8fafc" stroke-width="1.5"/>
      <polygon points="34,54 44,92 20,78" fill="url(#g1_sub)" stroke="#f8fafc" stroke-width="1.5"/>
      <!-- Crescent Inscription -->
      <path d="M66,42 A14,14 0 0,0 60,66 A16,16 0 1,1 66,42 Z" fill="#f8fafc" filter="url(#f1_glow)"/>
      <circle cx="70" cy="46" r="2" fill="#ffffff"/>
    
  </g>
</svg>