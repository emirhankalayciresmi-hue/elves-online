<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <linearGradient id="flagBg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#02140e" />
    </linearGradient>
    <linearGradient id="toxicTrim8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldAccent8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>
  <!-- Flag Shield Shape -->
  <path d="M10,10 L90,10 L90,75 C90,95 50,115 50,115 C50,115 10,95 10,75 Z" fill="url(#flagBg8)" stroke="url(#toxicTrim8)" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.6))"/>
  <path d="M16,16 L84,16 L84,72 C84,88 50,105 50,105 C50,105 16,88 16,72 Z" fill="none" stroke="url(#toxicTrim8)" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>
  
  <!-- Emblem: Coiled Emerald Cobra Serpent -->
  <g transform="translate(50,56) scale(0.72)">
    <!-- Snake Body Spiral -->
    <path d="M0,28 C16,28 24,18 20,8 C16,-2 0,0 2,-12 C4,-22 18,-24 16,-32 C14,-38 0,-36 -4,-30 C-10,-20 -2,-6 -10,4 C-16,12 -12,28 0,28 Z" fill="none" stroke="url(#toxicTrim8)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Cobra Hood & Head -->
    <path d="M-14,-22 C-18,-15 -2,-6 0,6 C2,-6 18,-15 14,-22 C8,-26 -8,-26 -14,-22 Z" fill="url(#toxicTrim8)" opacity="0.9"/>
    <!-- Head Triangle -->
    <path d="M0,-30 L-8,-20 L8,-20 Z" fill="url(#goldAccent8)"/>
    <!-- Snake Glowing Eyes -->
    <circle cx="-3" cy="-23" r="1.5" fill="#ef4444"/>
    <circle cx="3" cy="-23" r="1.5" fill="#ef4444"/>
    <!-- Forked Tongue -->
    <path d="M0,-30 L0,-35 M0,-35 L-2,-38 M0,-35 L2,-38" stroke="#ef4444" stroke-width="1.2" fill="none"/>
    <!-- Back scale runes -->
    <circle cx="0" cy="16" r="2.5" fill="url(#goldAccent8)"/>
    <circle cx="6" cy="5" r="2" fill="url(#goldAccent8)"/>
  </g>
  <!-- Flag Top Studs -->
  <circle cx="20" cy="10" r="2.5" fill="url(#toxicTrim8)" />
  <circle cx="50" cy="10" r="3" fill="url(#goldAccent8)" />
  <circle cx="80" cy="10" r="2.5" fill="url(#toxicTrim8)" />
</svg>
