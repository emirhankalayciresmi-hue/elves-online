<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg_stone" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="grad_stone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow_stone" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="20" fill="url(#bg_stone)"/>
  <rect x="8" y="8" width="240" height="240" rx="14" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="14" y="14" width="228" height="228" rx="10" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Magical Rune Stone Shape -->
  <g filter="url(#glow_stone)" transform="translate(128, 128)">
    <!-- Outer Glow Aura -->
    <polygon points="0,-85 65,-35 75,45 0,90 -75,45 -65,-35" fill="none" stroke="#818cf8" stroke-width="4" opacity="0.6"/>
    <!-- Crystal Body -->
    <polygon points="0,-80 60,-30 70,40 0,85 -70,40 -60,-30" fill="url(#grad_stone)"/>
    
    <!-- Facet Inner Lines -->
    <polygon points="0,-80 0,0 60,-30" fill="#a5b4fc" opacity="0.4"/>
    <polygon points="0,-80 0,0 -60,-30" fill="#38bdf8" opacity="0.5"/>
    <polygon points="0,0 70,40 0,85" fill="#6366f1" opacity="0.4"/>
    <polygon points="0,0 -70,40 0,85" fill="#4338ca" opacity="0.6"/>

    <!-- Sacred Elven Runic Symbol in Center -->
    <circle cx="0" cy="0" r="24" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
    <path d="M 0 -20 L 0 20 M -16 -8 L 16 8 M -16 8 L 16 -8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
    <circle cx="0" cy="-20" r="3" fill="#fef08a"/>
    <circle cx="0" cy="20" r="3" fill="#fef08a"/>
    <circle cx="-16" cy="-8" r="3" fill="#fef08a"/>
    <circle cx="16" cy="8" r="3" fill="#fef08a"/>
    <circle cx="-16" cy="8" r="3" fill="#fef08a"/>
    <circle cx="16" cy="-8" r="3" fill="#fef08a"/>
  </g>
</svg>
