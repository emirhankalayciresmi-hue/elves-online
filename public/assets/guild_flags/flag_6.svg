<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <linearGradient id="flagBg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="steelTrim6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="goldDetail6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>
  <!-- Flag Shield Shape -->
  <path d="M10,10 L90,10 L90,75 C90,95 50,115 50,115 C50,115 10,95 10,75 Z" fill="url(#flagBg6)" stroke="url(#steelTrim6)" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.6))"/>
  <path d="M16,16 L84,16 L84,72 C84,88 50,105 50,105 C50,105 16,88 16,72 Z" fill="none" stroke="url(#steelTrim6)" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  
  <!-- Emblem: Twin Swords & Central Shield -->
  <g transform="translate(50,58) scale(0.72)">
    <!-- Sword 1 (Crossing Left-Down to Right-Up) -->
    <g transform="rotate(45)">
      <rect x="-2" y="-45" width="4" height="65" fill="url(#steelTrim6)" rx="1"/>
      <path d="M-6,10 L6,10 L6,14 L-6,14 Z" fill="url(#goldDetail6)"/>
      <rect x="-1.5" y="14" width="3" height="14" fill="#334155" rx="1"/>
      <circle cx="0" cy="30" r="3.5" fill="url(#goldDetail6)"/>
      <path d="M0,-48 L-3,-42 L3,-42 Z" fill="#fff"/>
    </g>
    <!-- Sword 2 (Crossing Right-Down to Left-Up) -->
    <g transform="rotate(-45)">
      <rect x="-2" y="-45" width="4" height="65" fill="url(#steelTrim6)" rx="1"/>
      <path d="M-6,10 L6,10 L6,14 L-6,14 Z" fill="url(#goldDetail6)"/>
      <rect x="-1.5" y="14" width="3" height="14" fill="#334155" rx="1"/>
      <circle cx="0" cy="30" r="3.5" fill="url(#goldDetail6)"/>
      <path d="M0,-48 L-3,-42 L3,-42 Z" fill="#fff"/>
    </g>
    <!-- Central Knight Shield Crest -->
    <path d="M-14,-15 L14,-15 L14,10 C14,24 0,32 0,32 C0,32 -14,24 -14,10 Z" fill="#1e293b" stroke="url(#goldDetail6)" stroke-width="2.5"/>
    <circle cx="0" cy="5" r="4" fill="url(#goldDetail6)"/>
    <path d="M-7,-10 L7,-10 M0,-12 L0,20" stroke="url(#goldDetail6)" stroke-width="1.5"/>
  </g>
  <!-- Flag Top Studs -->
  <circle cx="20" cy="10" r="2.5" fill="url(#steelTrim6)" />
  <circle cx="50" cy="10" r="3" fill="url(#goldDetail6)" />
  <circle cx="80" cy="10" r="2.5" fill="url(#steelTrim6)" />
</svg>
