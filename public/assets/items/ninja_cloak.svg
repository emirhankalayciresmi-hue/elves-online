<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg_ninja" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#092e22"/>
      <stop offset="85%" stop-color="#051410"/>
      <stop offset="100%" stop-color="#020406"/>
    </radialGradient>
    
    <!-- Item Surface Gradient -->
    <linearGradient id="grad_ninja" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#051410"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Ornate Background Canvas -->
  <rect width="256" height="256" rx="20" fill="url(#bg_ninja)"/>
  
  <!-- Outer Ornate Elven Gold Border -->
  <rect x="8" y="8" width="240" height="240" rx="14" fill="none" stroke="#a7f3d0" stroke-width="2" opacity="0.6"/>
  <rect x="14" y="14" width="228" height="228" rx="10" fill="none" stroke="#34d399" stroke-width="1" opacity="0.3"/>
  
  <!-- Corner Filigree Diamonds -->
  <polygon points="14,14 20,8 26,14 20,20" fill="#a7f3d0"/>
  <polygon points="242,14 248,8 236,8 242,20" fill="#a7f3d0"/>
  <polygon points="14,242 20,248 26,242 20,236" fill="#a7f3d0"/>
  <polygon points="242,242 248,248 236,248 242,236" fill="#a7f3d0"/>

  <!-- Ambient Magic Aura -->
  <circle cx="128" cy="128" r="80" fill="#047857" opacity="0.25" filter="url(#glow)"/>

  <!-- Background Arcane Runic Ring -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#a7f3d0" stroke-width="1" stroke-dasharray="6,8" opacity="0.25"/>

  <!-- Main Slot Illustrated Artwork -->
  
      <!-- Brooches on Collar -->
      <circle cx="94" cy="62" r="8" fill="#a7f3d0" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="94" cy="62" r="4" fill="#34d399"/>
      <circle cx="162" cy="62" r="8" fill="#a7f3d0" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="162" cy="62" r="4" fill="#34d399"/>
      <line x1="102" y1="62" x2="154" y2="62" stroke="#a7f3d0" stroke-width="2"/>
      <!-- Flowing Cloak Fabric -->
      <path d="M90 68 C80 120 54 185 64 220 C84 210 112 216 128 206 C144 216 172 210 192 220 C202 185 176 120 166 68 Z" 
            fill="url(#grad_ninja)" stroke="#a7f3d0" stroke-width="3"/>
      <!-- Deep Inner Shadow Folds -->
      <path d="M102 75 C108 130 98 175 106 210" stroke="#059669" stroke-width="3" fill="none" opacity="0.8"/>
      <path d="M154 75 C148 130 158 175 150 210" stroke="#059669" stroke-width="3" fill="none" opacity="0.8"/>
      <!-- Hem Trim -->
      <path d="M64 220 Q128 200 192 220" stroke="#a7f3d0" stroke-width="3" fill="none"/>
    

  <!-- Item Level & Set Badge -->
  <g transform="translate(18, 222)">
    <rect width="64" height="18" rx="4" fill="#000000" opacity="0.75" stroke="#a7f3d0" stroke-width="1"/>
    <text x="32" y="13" font-family="'Cinzel', sans-serif" font-size="10" font-weight="bold" fill="#a7f3d0" text-anchor="middle">Lv. 1-10</text>
  </g>
</svg>