<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <linearGradient id="flagBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="50%" stop-color="#450a0a" />
      <stop offset="100%" stop-color="#1c0404" />
    </linearGradient>
    <linearGradient id="goldTrim1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
  </defs>
  <!-- Flag Shield Shape -->
  <path d="M10,10 L90,10 L90,75 C90,95 50,115 50,115 C50,115 10,95 10,75 Z" fill="url(#flagBg1)" stroke="url(#goldTrim1)" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.6))"/>
  <path d="M16,16 L84,16 L84,72 C84,88 50,105 50,105 C50,105 16,88 16,72 Z" fill="none" stroke="url(#goldTrim1)" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>
  
  <!-- Emblem: Golden Dragon -->
  <g transform="translate(50,55) scale(0.7)" fill="url(#goldTrim1)">
    <!-- Dragon Head & Horns -->
    <path d="M0,-35 C12,-35 22,-20 22,-5 C22,15 10,30 0,35 C-10,30 -22,15 -22,-5 C-22,-20 -12,-35 0,-35 Z" fill="none" stroke="url(#goldTrim1)" stroke-width="2"/>
    <path d="M-15,-20 C-30,-35 -40,-25 -30,-15 C-20,-5 -15,-5 -15,-5 Z" />
    <path d="M15,-20 C30,-35 40,-25 30,-15 C20,-5 15,-5 15,-5 Z" />
    <!-- Dragon Eyes -->
    <circle cx="-7" cy="-10" r="3" fill="#fef08a" />
    <circle cx="7" cy="-10" r="3" fill="#fef08a" />
    <!-- Snout & Fangs -->
    <path d="M-8,10 L0,22 L8,10 L5,5 L-5,5 Z" />
    <path d="M-5,10 L-8,18 L-3,12 Z" fill="#fff" />
    <path d="M5,10 L8,18 L3,12 Z" fill="#fff" />
    <!-- Dragon Crest Top -->
    <path d="M0,-42 L6,-30 L-6,-30 Z" />
  </g>
  <!-- Flag Top Crown Studs -->
  <circle cx="20" cy="10" r="2.5" fill="url(#goldTrim1)" />
  <circle cx="50" cy="10" r="3" fill="#fef08a" />
  <circle cx="80" cy="10" r="2.5" fill="url(#goldTrim1)" />
</svg>
