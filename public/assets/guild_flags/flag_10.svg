<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <linearGradient id="flagBg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44403c" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="bronzeTrim10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="metal10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>
  <!-- Flag Shield Shape -->
  <path d="M10,10 L90,10 L90,75 C90,95 50,115 50,115 C50,115 10,95 10,75 Z" fill="url(#flagBg10)" stroke="url(#bronzeTrim10)" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.6))"/>
  <path d="M16,16 L84,16 L84,72 C84,88 50,105 50,105 C50,105 16,88 16,72 Z" fill="none" stroke="url(#bronzeTrim10)" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>
  
  <!-- Emblem: War Hammer & Blacksmith Anvil with Sparks -->
  <g transform="translate(50,58) scale(0.72)">
    <!-- Heavy War Hammer (Angled) -->
    <g transform="rotate(-30, 0, -5)">
      <!-- Handle -->
      <rect x="-3" y="-15" width="6" height="50" rx="2" fill="url(#bronzeTrim10)"/>
      <rect x="-4" y="30" width="8" height="6" rx="1" fill="url(#metal10)"/>
      <!-- Hammer Head -->
      <rect x="-18" y="-28" width="36" height="16" rx="3" fill="url(#metal10)" stroke="url(#bronzeTrim10)" stroke-width="1.5"/>
      <rect x="-22" y="-26" width="6" height="12" rx="1" fill="url(#bronzeTrim10)"/>
      <polygon points="18,-26 26,-20 18,-14" fill="url(#bronzeTrim10)"/>
    </g>
    
    <!-- Heavy Anvil Base -->
    <path d="M-22,25 L22,25 L16,15 L-12,15 C-20,15 -25,12 -28,10 C-24,18 -18,20 -18,20 Z" fill="url(#metal10)" stroke="url(#bronzeTrim10)" stroke-width="1.5"/>
    <rect x="-16" y="25" width="32" height="6" rx="1" fill="url(#bronzeTrim10)"/>
    
    <!-- Glowing Sparks -->
    <circle cx="12" cy="-5" r="2" fill="#fbbf24"/>
    <circle cx="-14" cy="5" r="1.5" fill="#f97316"/>
    <circle cx="18" cy="8" r="1.5" fill="#ef4444"/>
    <circle cx="-2" cy="-18" r="1.5" fill="#fbbf24"/>
  </g>
  <!-- Flag Top Studs -->
  <circle cx="20" cy="10" r="2.5" fill="url(#bronzeTrim10)" />
  <circle cx="50" cy="10" r="3" fill="#fbbf24" />
  <circle cx="80" cy="10" r="2.5" fill="url(#bronzeTrim10)" />
</svg>
