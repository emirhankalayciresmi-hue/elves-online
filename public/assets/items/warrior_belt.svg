<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg_warrior" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#3b0d14"/>
      <stop offset="85%" stop-color="#1b0507"/>
      <stop offset="100%" stop-color="#020406"/>
    </radialGradient>
    
    <!-- Item Surface Gradient -->
    <linearGradient id="grad_warrior" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#1b0507"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Ornate Background Canvas -->
  <rect width="256" height="256" rx="20" fill="url(#bg_warrior)"/>
  
  <!-- Outer Ornate Elven Gold Border -->
  <rect x="8" y="8" width="240" height="240" rx="14" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
  <rect x="14" y="14" width="228" height="228" rx="10" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.3"/>
  
  <!-- Corner Filigree Diamonds -->
  <polygon points="14,14 20,8 26,14 20,20" fill="#fbbf24"/>
  <polygon points="242,14 248,8 236,8 242,20" fill="#fbbf24"/>
  <polygon points="14,242 20,248 26,242 20,236" fill="#fbbf24"/>
  <polygon points="242,242 248,248 236,248 242,236" fill="#fbbf24"/>

  <!-- Ambient Magic Aura -->
  <circle cx="128" cy="128" r="80" fill="#be123c" opacity="0.25" filter="url(#glow)"/>

  <!-- Background Arcane Runic Ring -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="6,8" opacity="0.25"/>

  <!-- Main Slot Illustrated Artwork -->
  
      <!-- Belt Strap Background -->
      <rect x="42" y="112" width="172" height="32" rx="4" fill="#141822" stroke="#fbbf24" stroke-width="2"/>
      <line x1="42" y1="128" x2="214" y2="128" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,4"/>
      <!-- Ornate Center Buckle Plate -->
      <path d="M100 100 L128 88 L156 100 L166 156 L128 174 L90 156 Z" 
            fill="url(#grad_warrior)" stroke="#fbbf24" stroke-width="3"/>
      <!-- Center Buckle Crest Gem -->
      <circle cx="128" cy="128" r="16" fill="#fbbf24" stroke="#e11d48" stroke-width="2"/>
      <polygon points="128,116 138,128 128,140 118,128" fill="#f43f5e" filter="url(#glow)"/>
      <circle cx="128" cy="128" r="3" fill="#ffffff"/>
      <!-- Hanging Tassels / Side Metal Plates -->
      <rect x="74" y="144" width="14" height="42" rx="2" fill="#fbbf24" stroke="#000000" stroke-width="1"/>
      <rect x="168" y="144" width="14" height="42" rx="2" fill="#fbbf24" stroke="#000000" stroke-width="1"/>
    

  <!-- Item Level & Set Badge -->
  <g transform="translate(18, 222)">
    <rect width="64" height="18" rx="4" fill="#000000" opacity="0.75" stroke="#fbbf24" stroke-width="1"/>
    <text x="32" y="13" font-family="'Cinzel', sans-serif" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle">Lv. 1-10</text>
  </g>
</svg>