<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <linearGradient id="flagBg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#1f0a02" />
    </linearGradient>
    <linearGradient id="solarGold9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="sunRuby9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>
  <!-- Flag Shield Shape -->
  <path d="M10,10 L90,10 L90,75 C90,95 50,115 50,115 C50,115 10,95 10,75 Z" fill="url(#flagBg9)" stroke="url(#solarGold9)" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.6))"/>
  <path d="M16,16 L84,16 L84,72 C84,88 50,105 50,105 C50,105 16,88 16,72 Z" fill="none" stroke="url(#solarGold9)" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>
  
  <!-- Emblem: Solar Crown & Radiating Sun Rays -->
  <g transform="translate(50,56) scale(0.72)">
    <!-- Sunburst 8 Rays -->
    <g stroke="url(#solarGold9)" stroke-width="2" opacity="0.6">
      <line x1="0" y1="-38" x2="0" y2="-28" />
      <line x1="0" y1="28" x2="0" y2="38" />
      <line x1="-38" y1="0" x2="-28" y2="0" />
      <line x1="28" y1="0" x2="38" y2="0" />
      <line x1="-26" y1="-26" x2="-18" y2="-18" />
      <line x1="18" y1="18" x2="26" y2="26" />
      <line x1="-26" y1="26" x2="-18" y2="18" />
      <line x1="18" y1="-18" x2="26" y2="-26" />
    </g>
    <!-- Sun Disc -->
    <circle cx="0" cy="5" r="22" fill="#451a03" stroke="url(#solarGold9)" stroke-width="2"/>
    
    <!-- Royal Sun Crown -->
    <path d="M-22,14 L-22,6 L-15,-6 L-6,2 L0,-16 L6,2 L15,-6 L22,6 L22,14 Z" fill="url(#solarGold9)"/>
    <rect x="-22" y="14" width="44" height="6" rx="2" fill="url(#solarGold9)"/>
    
    <!-- Crown Jewels -->
    <circle cx="-15" cy="-6" r="2.5" fill="url(#sunRuby9)"/>
    <circle cx="0" cy="-16" r="3.5" fill="url(#sunRuby9)"/>
    <circle cx="15" cy="-6" r="2.5" fill="url(#sunRuby9)"/>
    <circle cx="0" cy="17" r="2" fill="url(#sunRuby9)"/>
    <circle cx="-12" cy="17" r="1.5" fill="url(#sunRuby9)"/>
    <circle cx="12" cy="17" r="1.5" fill="url(#sunRuby9)"/>
  </g>
  <!-- Flag Top Studs -->
  <circle cx="20" cy="10" r="2.5" fill="url(#solarGold9)" />
  <circle cx="50" cy="10" r="3" fill="#fef08a" />
  <circle cx="80" cy="10" r="2.5" fill="url(#solarGold9)" />
</svg>
