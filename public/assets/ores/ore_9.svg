<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Radial Back Glow -->
    <radialGradient id="g9_ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#4ade80" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Main Gradient -->
    <linearGradient id="g9_main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="45%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Sub Gradient -->
    <linearGradient id="g9_sub" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="f9_glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="64" cy="64" r="54" fill="url(#g9_ambient)"/>

  <!-- Main Gemstone Shapes -->
  <g>
    
      <!-- Forest Heart Geode -->
      <path d="M64,32 C54,16 28,18 24,44 C20,66 52,94 64,104 C76,94 108,66 104,44 C100,18 74,16 64,32 Z" fill="url(#g9_main)" stroke="#86efac" stroke-width="2.5" filter="url(#f9_glow)"/>
      <path d="M64,40 C56,28 36,30 32,50 C28,68 54,90 64,98 C74,90 100,68 96,50 C92,30 72,28 64,40 Z" fill="#15803d"/>
      <!-- Geode Core Crystals -->
      <polygon points="64,48 72,64 64,78 56,64" fill="#86efac"/>
      <polygon points="50,56 58,70 52,80 44,70" fill="#22c55e"/>
      <polygon points="78,56 86,70 80,80 72,70" fill="#22c55e"/>
      <!-- Golden Roots Wrapping -->
      <path d="M22,50 Q40,64 64,54 Q88,44 106,52" fill="none" stroke="#eab308" stroke-width="2"/>
      <path d="M30,80 Q50,70 64,82 Q78,94 98,80" fill="none" stroke="#eab308" stroke-width="2"/>
    
  </g>
</svg>