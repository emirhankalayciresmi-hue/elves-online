<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <linearGradient id="flagBg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#0f051d" />
    </linearGradient>
    <linearGradient id="arcaneTrim7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="runeGlow7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <!-- Flag Shield Shape -->
  <path d="M10,10 L90,10 L90,75 C90,95 50,115 50,115 C50,115 10,95 10,75 Z" fill="url(#flagBg7)" stroke="url(#arcaneTrim7)" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.6))"/>
  <path d="M16,16 L84,16 L84,72 C84,88 50,105 50,105 C50,105 16,88 16,72 Z" fill="none" stroke="url(#arcaneTrim7)" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>
  
  <!-- Emblem: Arcane Mystic Eye & Magic Ring -->
  <g transform="translate(50,58) scale(0.72)">
    <!-- Magic Ring with Runes -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#arcaneTrim7)" stroke-width="2" stroke-dasharray="8,4"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="url(#runeGlow7)" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Four cardinal spikes -->
    <path d="M0,-36 L3,-26 L-3,-26 Z" fill="url(#arcaneTrim7)"/>
    <path d="M0,36 L3,26 L-3,26 Z" fill="url(#arcaneTrim7)"/>
    <path d="M-36,0 L-26,-3 L-26,3 Z" fill="url(#arcaneTrim7)"/>
    <path d="M36,0 L26,-3 L26,3 Z" fill="url(#arcaneTrim7)"/>
    
    <!-- All-Seeing Arcane Eye -->
    <path d="M-22,0 C-10,-16 10,-16 22,0 C10,16 -10,16 -22,0 Z" fill="#2e1065" stroke="url(#arcaneTrim7)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="10" fill="url(#runeGlow7)"/>
    <circle cx="0" cy="0" r="5" fill="#0f051d"/>
    <circle cx="2" cy="-2" r="2" fill="#ffffff"/>
  </g>
  <!-- Flag Top Studs -->
  <circle cx="20" cy="10" r="2.5" fill="url(#arcaneTrim7)" />
  <circle cx="50" cy="10" r="3" fill="#38bdf8" />
  <circle cx="80" cy="10" r="2.5" fill="url(#arcaneTrim7)" />
</svg>
