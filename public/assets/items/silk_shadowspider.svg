<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg_silk" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="70%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="grad_silk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow_silk" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="20" fill="url(#bg_silk)"/>
  <rect x="8" y="8" width="240" height="240" rx="14" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="14" y="14" width="228" height="228" rx="10" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Mystic Shadow Silk Thread & Spool -->
  <g filter="url(#glow_silk)" transform="translate(128, 128)">
    <!-- Spider Web Background -->
    <path d="M -70 -70 L 70 70 M -70 70 L 70 -70 M 0 -85 L 0 85 M -85 0 L 85 0" stroke="#34d399" stroke-width="1.5" opacity="0.35"/>
    <polygon points="0,-60 42,-42 60,0 42,42 0,60 -42,42 -60,0 -42,-42" fill="none" stroke="#6ee7b7" stroke-width="1.5" opacity="0.4"/>
    <polygon points="0,-35 25,-25 35,0 25,25 0,35 -25,25 -35,0 -25,-25" fill="none" stroke="#a7f3d0" stroke-width="1.5" opacity="0.5"/>

    <!-- Glowing Silk Cocoon / Skein -->
    <ellipse cx="0" cy="0" rx="42" ry="52" fill="url(#grad_silk)" stroke="#ecfdf5" stroke-width="2"/>
    <path d="M -30 -30 Q 0 -10 30 -30" stroke="#d1fae5" stroke-width="3" fill="none"/>
    <path d="M -38 -10 Q 0 10 38 -10" stroke="#d1fae5" stroke-width="3" fill="none"/>
    <path d="M -40 10 Q 0 30 40 10" stroke="#d1fae5" stroke-width="3" fill="none"/>
    <path d="M -30 30 Q 0 50 30 30" stroke="#d1fae5" stroke-width="3" fill="none"/>

    <!-- Trailing Green Silk Strands -->
    <path d="M 20 40 Q 60 70 85 60 Q 60 90 25 65" fill="#10b981" opacity="0.8"/>
    <circle cx="0" cy="0" r="12" fill="#a7f3d0" opacity="0.9"/>
  </g>
</svg>
